name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: flake check (${{ matrix.nixpkgs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "locked" is the revision in flake.lock; the second run catches
        # drift in nixpkgs (renamed MIME types, changed NixOS options).
        nixpkgs: [locked, nixos-unstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: nix flake check
        run: |
          if [ "${{ matrix.nixpkgs }}" = locked ]; then
            nix flake check --print-build-logs
          else
            nix flake check --print-build-logs --no-write-lock-file \
              --override-input nixpkgs "github:NixOS/nixpkgs/${{ matrix.nixpkgs }}"
          fi

  # A pushed tag v* becomes a GitHub release once the checks passed.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
